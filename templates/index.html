<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spam Classifier</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,900%7CShare+Tech+Mono%7CSpace+Mono" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            background: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        h1 {
            color: #154360;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
        }
        button {
            margin-top: 15px;
            background: #154360;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background: #1a5276;
        }
        .message {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .spam {
            color: maroon;
            border: 2px solid maroon;
        }
        .not-spam {
            color: #145A32;
            border: 2px solid #145A32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spam Classifier</h1>
        <form action="{{ url_for('predict') }}" method="POST" id="myform">
            <textarea name="message" id="submission" placeholder="Enter text to check..."></textarea>
            <button type="submit">Check</button>
        </form>

        {% if prediction %}
            {% if prediction == "Spam Detected - Be Careful!" %}
                <p class="message spam">{{ prediction }}</p>
            {% else %}
                <p class="message not-spam">{{ prediction }}</p>
            {% endif %}
        {% endif %}
    </div>

    <script>
        $(document).ready(function() {
            $('button').click(function() {
                $('#myform').submit();
            });
        });
    </script>
</body>
</html>
